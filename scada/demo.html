     ================================================================ */
  function silos(){
    const ctx = build(1120, 430);
    titleBlock(ctx, 'P-101  ·  GRAIN INTAKE & SILO STORAGE', 'Tip pit → pre-cleaner → bucket elevator → distributor → storage silos');

    // ---- piping (drawn first, behind equipment) ----
    stream(ctx, [[96,338],[110,338]], R('M_IC1'));                       // tip → drag
    stream(ctx, [[250,344],[262,344],[262,344]], R('M_IC1'));            // drag → elevator boot
    stream(ctx, [[262,344],[266,344],[266,344]], R('M_IC1'), {arrow:false});
    stream(ctx, [[280,78],[280,68],[352,68],[352,92]], R('M_BE1'));      // elevator head → pre-cleaner
    stream(ctx, [[460,118],[510,118],[510,128]], R('M_PC1'));            // pre-cleaner → distributor
    // distribution header + drops into each silo
    const sx0=560, sp=88, sw=64, siloTop=176, headerY=150;
    stream(ctx, [[524,128],[524,headerY],[sx0+5*sp+sw/2,headerY]], R('M_DST'), {arrow:false});
    for (let i=0;i<6;i++){ const cx=sx0+i*sp+sw/2;
      stream(ctx, [[cx,headerY],[cx,siloTop]], ()=>PLC.read('M_DST_RUN')&&PLC.read('SP_FILL_TARGET')===i, {thin:true}); }
    // silo discharge → tempering
    stream(ctx, [[sx0+sw/2,328],[sx0+sw/2,388],[1048,388]], ()=>PLC.read('PV_FILL_TPH')>0.5);

    // ---- equipment ----
    hopper(ctx, 46, 300, 50, 38);
    drag(ctx, 110, 334, 140, 'M_IC1', {motorAt:[110+10, 334+20+15]});
    elevator(ctx, 264, 72, 30, 270, 'M_BE1');
    sifter(ctx, 352, 92, 108, 50, 'M_PC1', {motorAt:[460+12, 142]});
    fan(ctx, 540, 60, 'M_DEDUST', {r:16, motorAt:[540+30, 60]});
    distributor(ctx, 524, 118, 'M_DST');
    for (let i=0;i<6;i++) silo(ctx, sx0+i*sp, siloTop, sw, 152, 'S'+(i+1));

    // ---- labels (placed clear of equipment) ----
    lbl(ctx, 71, 358, 'TP-101', 'Tip Pit');
    lbl(ctx, 180, 392, 'DC-102', 'Intake Drag');
    lbl(ctx, 240, 64, 'BE-105', 'Elevator', 'end');
    lbl(ctx, 406, 84, 'CL-104', 'Pre-Cleaner');
    lbl(ctx, 540, 30, 'FN-103', 'Dedust', 'middle');
    lbl(ctx, 470, 118, 'DV-106', 'Distributor', 'start');
    for (let i=0;i<6;i++){ const cx=sx0+i*sp+sw/2;
      lbl(ctx, cx, 348, 'SI-11'+(i+1), null);
    }
    // grain-type sublabel below tag
    for (let i=0;i<6;i++){ const cx=sx0+i*sp+sw/2; const t=txt(cx,360,'','eq-name',{'text-anchor':'middle'}); ctx.S.appendChild(t);
      ctx.reg.push(()=>t.textContent=PLC.GRAIN_TYPES[PLC.read('S'+(i+1)+'_GRAIN')]||''); }
    flag(ctx, 1044, 382, 'DISCHARGE → P-201', 'end');

    // ---- instruments ----
    inst(ctx, 318, 330, 'WT', '101', {lead:[280,338]});          // intake weigh
    for (let i=0;i<6;i++){ const cx=sx0+i*sp+sw/2; inst(ctx, sx0+i*sp+sw+10, 210, 'LT', '11'+(i+1), {r:10, lead:[sx0+i*sp+sw, 210]}); }

    // ---- readouts (top-left lane, clear of equipment) ----
    readout(ctx, 18, 54, 150, 'INTAKE RATE  t/h', ()=>UI.num(PLC.read('PV_FILL_TPH'),1));
    readout(ctx, 18, 98, 150, 'DESTINATION', ()=>PLC.VESSELS[PLC.read('SP_FILL_TARGET')][1]);
    readout(ctx, 18, 142, 150, 'GRAIN TYPE', ()=>PLC.GRAIN_TYPES[PLC.read('SP_FILL_GRAIN')]);
    return wrap(ctx);
  }

  /* ================================================================
     DIAGRAM: GRAIN TEMPERING               P-201
     ================================================================ */
  function temper(){
    const ctx = build(1160, 450);
    titleBlock(ctx, 'P-201  ·  GRAIN TEMPERING / CONDITIONING', 'Weigher → dampener (water addition) → elevator → temper bins → screw → mill');
    const tRun = ()=>PLC.read('LINE_TEMPER_RUN');

    const binX=[490,640,790,940], binW=110, binTop=120, binBot=250;
    // ---- piping ----
    stream(ctx, [[40,168],[100,168]], tRun);                              // from silos → weigher
    stream(ctx, [[130,190],[150,190],[150,196]], tRun);                   // weigher → dampener
    stream(ctx, [[250,86],[250,110]], R('M_WP1'), {water:true,thin:true});// tank → pump
    stream(ctx, [[250,124],[250,150],[210,150],[210,184]], R('M_WP1'), {water:true,thin:true}); // pump → dampener
    stream(ctx, [[370,196],[392,196],[392,330],[404,330]], R('M_DAMP')); // dampener → elevator boot
    stream(ctx, [[440,130],[460,130],[460,120]], R('M_BE2'), {arrow:false});
    stream(ctx, [[440,120],[480,120],[480,binTop]], R('M_BE2'), {arrow:false}); // elevator head → header
    const hdrY=104; stream(ctx, [[440,118],[440,hdrY],[binX[3]+binW/2,hdrY]], R('M_BE2'), {arrow:false});
    binX.forEach((bx)=>stream(ctx, [[bx+binW/2,hdrY],[bx+binW/2,binTop]], R('M_BE2'), {thin:true}));
    // bins → screws
    const scY=322;
    [0,1].forEach(i=>stream(ctx, [[binX[i]+binW/2,binBot],[binX[i]+binW/2,scY]], R('M_TC1'), {thin:true}));
    [2,3].forEach(i=>stream(ctx, [[binX[i]+binW/2,binBot],[binX[i]+binW/2,scY]], R('M_TC2'), {thin:true}));
    stream(ctx, [[binX[1]+binW/2,scY+9],[binX[1]+binW/2+40,scY+9]], tRun, {arrow:false});
    stream(ctx, [[binX[3]+binW/2,scY+9],[1058,scY+9],[1058,scY+9]], tRun, {arrow:false});
    stream(ctx, [[1050,scY],[1090,scY]], tRun);                           // → milling

    // ---- equipment ----
    hopper(ctx, 70, 120, 60, 34);
    tank(ctx, 222, 50, 56, 36, {water:true});
    pump(ctx, 250, 117, 'M_WP1', {motorAt:[250+24, 117]});
    auger(ctx, 150, 184, 220, 'M_DAMP', {motorAt:[150+220+12, 184+9]});
    elevator(ctx, 404, 120, 30, 222, 'M_BE2');
    binX.forEach((bx,i)=>silo(ctx, bx, binTop, binW, binBot-binTop, 'TB'+(i+1), {cone:false}));
    auger(ctx, binX[0]+binW/2, scY, 240, 'M_TC1', {motorAt:[binX[0]+binW/2-12, scY+9]});
    auger(ctx, binX[2]+binW/2, scY, 240, 'M_TC2', {motorAt:[binX[2]+binW/2-12, scY+9]});

    // ---- labels ----
    lbl(ctx, 100, 172, 'WH-201', null, 'middle');
    lbl(ctx, 214, 60, 'TK-203', 'Water', 'end');
    lbl(ctx, 230, 232, 'MX-202', 'Dampener', 'middle');
    lbl(ctx, 419, 112, 'BE-205', null, 'end');
    binX.forEach((bx,i)=>lbl(ctx, bx+binW/2, binTop-10, 'TB-21'+(i+1), 'Temper Bin '+(i+1)));
    lbl(ctx, binX[0]+binW/2+108, scY+34, 'SC-216', 'Screw', 'middle');
    lbl(ctx, binX[2]+binW/2+108, scY+34, 'SC-217', 'Screw', 'middle');
    flag(ctx, 38, 150, 'FROM P-101');
    flag(ctx, 1140, scY+3, '→ P-301 MILLING', 'end');

    // ---- instruments ----
    inst(ctx, 100, 132, 'WT', '201', {lead:[100,120]});
    inst(ctx, 392, 250, 'MT', '202', {lead:[392,210]});          // outlet moisture on riser
    inst(ctx, 250, 150, 'FT', '204', {r:10, lead:[230,150]});    // water flow
    binX.forEach((bx,i)=>inst(ctx, bx+binW-2, binTop+16, 'LT', '21'+(i+1), {r:9, lead:[bx+binW, binTop+16]}));

    // ---- readouts (top-right lane) ----
    readout(ctx, 640, 22, 156, 'INLET MOISTURE  %', ()=>UI.num(PLC.read('PV_INLET_MOIST'),1));
    readout(ctx, 808, 22, 156, 'TEMPERED  %', ()=>UI.num(PLC.read('PV_TEMPER_MOIST'),1));
    readout(ctx, 976, 22, 156, 'WATER  L/min', ()=>UI.num(PLC.read('PV_WATER_LPM'),1));
    return wrap(ctx, [['var(--run)','Running'],['var(--stop)','Stopped'],['var(--alarm)','Fault'],['var(--grain)','Grain flow'],['var(--water)','Water addition']]);
  }

  /* ================================================================
     DIAGRAM: MILLING                       P-301
     ================================================================ */
  function mill(){
    const ctx = build(1200, 470);
    titleBlock(ctx, 'P-301  ·  ROLLER MILLING', 'Break → plansifter → reduction → purifier → pneumatic lift → packing');

    const rollX=[90,250,420,580], rollTopY=104, rollBotY=178;
    const sifX=90, sifY=250, sifW=510, sifH=66;
    // ---- piping ----
    stream(ctx, [[44,92],[rollX[0]+38,92],[rollX[0]+38,rollTopY]], ()=>PLC.read('LINE_MILL_RUN')); // feed → B1
    const rollTags=['M_B1','M_B2','M_C1','M_C2'];
    rollX.forEach((rx,i)=>stream(ctx, [[rx+38,rollBotY],[rx+38,sifY]], R(rollTags[i]), {thin:true}));   // rolls → sifter
    stream(ctx, [[sifX+sifW,sifY+sifH/2],[680,sifY+sifH/2]], R('M_SIFT'));                              // sifter → purifier
    stream(ctx, [[776,sifY+sifH/2],[810,sifY+sifH/2],[810,358],[840,358]], R('M_PUR'));                 // purifier → packing
    stream(ctx, [[880,150],[880,sifY-6]], R('M_PNF'), {thin:true, arrow:false});                        // fan lift duct
    stream(ctx, [[960,366],[988,366]], R('M_PACK'));                                                    // packing → flour bag
    stream(ctx, [[rollX[1]+38,sifY+sifH],[rollX[1]+38,402],[598,402]], ()=>PLC.read('PV_MILL_TPH')>0.5);// bran out

    // ---- equipment ----
    rollX.forEach((rx,i)=>rollStand(ctx, rx, rollTopY, rollTags[i]));
    sifter(ctx, sifX, sifY, sifW, sifH, 'M_SIFT', {motorAt:[sifX+sifW+12, sifY+14]});
    purifier(ctx, 680, sifY, 96, sifH, 'M_PUR');
    fan(ctx, 880, 124, 'M_PNF', {r:22, motorAt:[880, 124+22+13]});
    auger(ctx, 840, 358, 120, 'M_PACK', {motorAt:[840-12, 367]});
    ctx.S.appendChild(E('rect',{class:'eq-grain',x:990,y:354,width:22,height:26,rx:2}));

    // ---- labels ----
    const rollNames=['1st Break','2nd Break','1st Reduction','2nd Reduction'];
    const rollNo=['RM-301','RM-302','RM-303','RM-304'];
    rollX.forEach((rx,i)=>lbl(ctx, rx+38, rollTopY-10, rollNo[i], rollNames[i]));
    lbl(ctx, 209, sifY-10, 'PS-305 · Plansifter', null, 'middle');
    lbl(ctx, 728, sifY-10, 'PR-306', 'Purifier', 'middle');
    lbl(ctx, 880, 124-32, 'FN-307', 'Pneumatic Fan', 'middle');
    lbl(ctx, 900, 392, 'PK-308', 'Packing', 'middle');
    flag(ctx, 14, 110, 'FROM P-201');
    flag(ctx, 1001, 398, '→ FLOUR', 'middle');
    flag(ctx, 606, 406, '→ BRAN / OFFAL');

    // ---- instruments ----
    inst(ctx, 70, 74, 'WT', '301', {r:10, lead:[90, 92]});
    inst(ctx, 810, 326, 'QT', '305', {r:10, lead:[810, 350]});

    // ---- readouts (top-right lane) ----
    readout(ctx, 720, 22, 150, 'MILL RATE  t/h', ()=>UI.num(PLC.read('PV_MILL_TPH'),1));
    readout(ctx, 884, 22, 150, 'EXTRACTION  %', ()=>UI.num(PLC.read('PV_EXTRACTION'),0));
    readout(ctx, 1048, 22, 138, 'FLOUR ASH  %', ()=>UI.num(PLC.read('PV_ASH'),2));
    return wrap(ctx);
  }

  /* ================================================================
     DIAGRAM: WHOLE PLANT OVERVIEW
     ================================================================ */
  function plant(){
    const ctx = build(1280, 480);
    titleBlock(ctx, 'GRAIN HANDLING & FLOUR MILLING — PROCESS OVERVIEW', 'Wheat intake → storage → tempering → milling → flour & bran');
    zone(ctx,20,64,392,372,'P-101  INTAKE & STORAGE');
    zone(ctx,432,64,360,372,'P-201  TEMPERING');
    zone(ctx,812,64,448,372,'P-301  MILLING');
    flowArrow(ctx,414,206,'Cleaned',R('M_DST'));
    flowArrow(ctx,786,206,'Tempered',R('M_BE2'));
    flag(ctx,36,58,'↓ WHEAT INTAKE');

    // ---- INTAKE ----
    stream(ctx,[[150,360],[150,150]],R('M_BE1'),{thin:true,arrow:false});
    stream(ctx,[[165,150],[206,150]],R('M_PC1'),{thin:true});
    stream(ctx,[[300,168],[300,150],[330,150],[330,196]],R('M_DST'),{thin:true});
    hopper(ctx,44,332,38,26);
    drag(ctx,80,338,62,'M_IC1',{motorAt:[90,372]});
    elevator(ctx,136,118,26,248,'M_BE1');
    sifter(ctx,206,128,80,38,'M_PC1',{motorAt:[206+80+11,142]});
    distributor(ctx,300,168,'M_DST');
    silo(ctx,288,206,30,116,'S1',{noGrain:true}); silo(ctx,330,206,30,116,'S2',{noGrain:true}); silo(ctx,372,206,28,116,'S3',{noGrain:true});
    lbl(ctx,330,338,'SI-111/3',null,'middle');
    readout(ctx,40,392,196,'INTAKE  t/h',()=>UI.num(PLC.read('PV_FILL_TPH'),1));

    // ---- TEMPERING ----
    tank(ctx,446,92,34,26,{water:true}); pump(ctx,520,118,'M_WP1',{motorAt:[520+22,118]});
    stream(ctx,[[520,105],[520,150],[496,150],[496,172]],R('M_WP1'),{water:true,thin:true});
    auger(ctx,448,172,148,'M_DAMP',{motorAt:[448+148+11,181]});
    stream(ctx,[[596,181],[618,181],[618,330],[628,330]],R('M_DAMP'),{thin:true});
    elevator(ctx,624,120,26,230,'M_BE2');
    stream(ctx,[[650,150],[686,150]],R('M_BE2'),{thin:true});
    silo(ctx,686,150,44,120,'TB1',{cone:false,noGrain:true}); silo(ctx,734,150,44,120,'TB2',{cone:false,noGrain:true});
    lbl(ctx,520,204,'MX-202',null,'middle');
    lbl(ctx,710,140,'TB-211/2',null,'middle');
    readout(ctx,448,392,150,'TEMPER MOIST  %',()=>UI.num(PLC.read('PV_TEMPER_MOIST'),1));

    // ---- MILLING ----
    stream(ctx,[[878,168],[878,196]],R('M_B1'),{thin:true});
    stream(ctx,[[878,232],[920,256]],R('M_B1'),{thin:true,arrow:false});
    stream(ctx,[[998,196],[998,168]],R('M_C1'),{thin:true,arrow:false});
    stream(ctx,[[1080,286],[1140,286]],R('M_SIFT'),{thin:true});
    rollStand(ctx,840,128,'M_B1'); rollStand(ctx,960,128,'M_C1');
    sifter(ctx,840,256,236,58,'M_SIFT',{motorAt:[840+236+11,270]});
    purifier(ctx,1140,256,64,58,'M_PUR');
    fan(ctx,1180,150,'M_PNF',{r:18,motorAt:[1180,150+18+12]});
    lbl(ctx,878,118,'RM-301',null,'middle'); lbl(ctx,998,118,'RM-303',null,'middle');
    lbl(ctx,958,250,'PS-305',null,'middle');
    lbl(ctx,1172,236,'PR-306',null,'middle');
    flag(ctx,1150,360,'→ FLOUR'); flag(ctx,1150,384,'→ BRAN');
    readout(ctx,840,392,150,'MILL RATE  t/h',()=>UI.num(PLC.read('PV_MILL_TPH'),1));
    readout(ctx,1008,392,150,'FLOUR  t',()=>UI.num(PLC.read('CNT_FLOUR_TODAY'),1));
    return wrap(ctx);
  }

  return { silos, temper, mill, plant };
})();
window.MIMIC = MIMIC;

  </script>
  <script>
/* ====================================================================
   app.js — application shell, router, and page renderers
   ==================================================================== */
(() => {
  const { el, num } = UI;
  const $ = (s) => document.querySelector(s);

  /* ---- navigation model ----------------------------------------- */
  const PAGES = [
    { id:'dashboard',label:'Dashboard',      tab:'Home',    ic:'⌂', group:'Operations' },
    { id:'process',  label:'Process Overview',tab:'Process',ic:'⬡', group:'Operations' },
    { id:'silos',    label:'Silo Filling',   tab:'Silos',   ic:'▤',  group:'Operations' },
    { id:'temper',   label:'Grain Tempering',tab:'Temper',  ic:'💧', group:'Operations' },
    { id:'mill',     label:'Milling',        tab:'Mill',    ic:'⚙',  group:'Operations' },
    { id:'reports',  label:'Reporting',      tab:'Reports', ic:'▦',  group:'Management' },
    { id:'settings', label:'Settings',       tab:'Settings',ic:'☰', group:'Management' },
  ];

  let current = location.hash.replace('#','') || 'dashboard';
  let pageOff = null; // unsubscribe of current page live bindings

  /* ================================================================
     SHELL
     ================================================================ */
  function buildShell(){
    document.body.innerHTML = '';
    // sidebar navigation
    const nav = el('nav', { class:'sb-nav' });
    let lastGroup = '';
    PAGES.forEach(p => {
      if (p.group !== lastGroup){ nav.appendChild(el('div',{class:'sb-group-label'}, p.group)); lastGroup=p.group; }
      nav.appendChild(el('a', { 'data-page':p.id, class:'sb-item'+(p.id===current?' active':''), onclick:()=>go(p.id) },
        el('span',{class:'ic'}, p.ic),
        el('span',{}, p.label),
        p.id==='dashboard'?el('span',{class:'badge hidden','data-alarmbadge':''},'0'):null));
    });

    const op = currentOperator();
    const app = el('div', { id:'app' },
      el('aside', { class:'sidebar' },
        el('div',{class:'sb-brand'},
          el('div',{class:'logo'},'W'),
          el('div',{class:'nm'},'Wyelec Mill', el('small',{},'Grain & Flour Milling'))),
        nav,
        el('div',{class:'sb-foot'},
          connPill(),
          el('button',{class:'sb-user', title:'Operator', onclick:()=>UI.toast('Operator: '+op)},
            el('span',{class:'ava'}, op.split(/[ .]/).map(s=>s[0]).join('').slice(0,2)),
            el('span',{class:'who'}, el('b',{}, op), el('span',{},'Operator'))),
        ),
      ),
      el('div', { class:'main-col' },
        el('header', { class:'topbar' },
          el('div',{class:'tb-title'}, el('h1',{'data-title':''},''), el('p',{'data-sub':''},'')),
          el('div',{class:'spacer'}),
          el('div',{class:'clock','data-clock':''},''),
          el('button',{class:'nb-btn theme-toggle','data-themebtn':'',title:'Toggle theme',onclick:toggleTheme},''),
        ),
        el('main', { class:'main', id:'page' }),
      ),
    );
    document.body.appendChild(app);
    document.body.appendChild(el('div',{class:'modal-overlay',id:'modal-root'}));
    setTheme(currentTheme());
    tickClock();
  }

  function connPill(){
    return el('div', { class:'conn-pill','data-conn':'' },
      el('span',{class:'dot'}), el('span',{class:'txt-lbl','data-conntext':''},'—'));
  }

  function updateConn(){
    const s = PLC.connection();
    const pill = $('[data-conn]'); if (!pill) return;
    pill.className = 'conn-pill ' + (s==='online'?'online': s==='sim'?'sim':'offline');
    const map = { online:'PLC ONLINE', sim:'SIMULATION', connecting:'CONNECTING…', offline:'OFFLINE' };
    $('[data-conntext]').textContent = map[s]||s;
    const drv=$('[data-drv]'); if(drv) drv.textContent = PLC.getCfg().driver.toUpperCase();
  }

  function tickClock(){
    const c=$('[data-clock]'); if(c) c.textContent = new Date().toLocaleString('en-AU',{hour12:false});
    setTimeout(tickClock, 1000);
  }

  function currentOperator(){ return localStorage.getItem('scada.operator') || PLC.OPERATORS[0]; }

  /* ---- theme (light / dark) ------------------------------------- */
  function currentTheme(){ return localStorage.getItem('scada.theme') || 'dark'; }
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('scada.theme', t);
    const btn=$('[data-themebtn]');
    if (btn) btn.textContent = t==='dark' ? '☀' : '☾';
  }
  function toggleTheme(){ setTheme(currentTheme()==='dark'?'light':'dark'); }

  /* ---- alarm banner / badge ------------------------------------- */
  function refreshAlarms(){
    const alarms = PLC.activeAlarms().sort((a,b)=> (a.sev===b.sev?0:a.sev==='alarm'?-1:1));
    const badge = $('[data-alarmbadge]');
    const stat = $('[data-alarmstat]');
    if (badge){ badge.textContent = alarms.length; badge.classList.toggle('hidden', alarms.length===0); }
    if (stat){
      if (!alarms.length){ stat.innerHTML='● No active alarms'; stat.style.color='var(--run)'; }
      else { const top=alarms[0]; stat.innerHTML='● '+alarms.length+' active — '+top.msg; stat.style.color=top.sev==='alarm'?'var(--alarm)':'var(--warn)'; }
    }
    // page-level banner
    const banner = $('[data-banner]');
    if (banner){
      const unack = alarms.filter(a=>!a.ack);
      if (!alarms.length){ banner.className='alarm-banner'; }
      else {
        const worst = alarms[0].sev;
        banner.className = 'alarm-banner show '+(worst==='warn'?'warn':'')+(unack.length?' blink':'');
        banner.innerHTML='';
        banner.append(
          el('span',{},'⚠'),
          el('span',{class:'count'},alarms.length),
          el('span',{}, alarms[0].msg + (alarms.length>1?` (+${alarms.length-1} more)`:'')),
          el('button',{class:'ack',onclick:()=>{PLC.ackAll();refreshAlarms();}},'ACK ALL'),
        );
      }
    }
  }

  /* ================================================================
     ROUTER
     ================================================================ */
  function go(id){
    current = id; location.hash = id;
    document.querySelectorAll('.sb-item[data-page]').forEach(a=>a.classList.toggle('active', a.dataset.page===id));
    render();
    $('#page').scrollTop = 0;
  }

  function render(){
    if (pageOff){ pageOff(); pageOff=null; }
    const main = $('#page');
    const page = PAGES.find(p=>p.id===current) || PAGES[0];
    const t=$('[data-title]'), s=$('[data-sub]');
    if (t) t.textContent = page.label;
    if (s) s.textContent = pageSub(current);
    main.innerHTML='';
    main.appendChild(el('div',{class:'alarm-banner','data-banner':''}));
    const fn = RENDER[current] || RENDER.dashboard;
    const ctx = { refresh: [] };
    main.appendChild(fn(ctx));
    // live binding: re-run lightweight refreshers on tag updates
    pageOff = PLC.onUpdate(() => { ctx.refresh.forEach(f=>{ try{f();}catch(e){} }); refreshAlarms(); updateConn(); });
    refreshAlarms(); updateConn();
  }

  function pageSub(id){
    return ({
      dashboard:'Live plant status, KPIs & area controls',
      process:'Whole-plant process diagram — intake to flour',
      silos:'Intake & silo filling — process mimic, blends & fill control',
      temper:'Grain conditioning — process mimic, moisture & dwell control',
      mill:'Roller milling — process mimic, rate, recipe & extraction',
      reports:'Production counters, recipe logs & operator KPIs',
      settings:'Background configuration & PLC connection',
    })[id]||'';
  }

  /* helper: a self-refreshing text node bound to a tag */
  function live(ctx, fn, node){ const upd=()=>{ const v=fn(); if(node.textContent!==v) node.textContent=v; }; ctx.refresh.push(upd); return node; }

  /* ================================================================
     PAGE: OVERVIEW
     ================================================================ */
  const RENDER = {};

  /* ---- a mimic panel wrapper used by several pages -------------- */
  function mimicPanel(ctx, title, builder, hint){
    const diag = builder();
    ctx.refresh.push(diag.refresh);
    return el('div',{class:'panel',style:'margin-bottom:16px'},
      el('div',{class:'panel-head'}, el('h2',{}, title), el('div',{class:'spacer'}),
        hint?el('span',{class:'hint'}, hint):null),
      diag.node);
  }

  RENDER.process = (ctx) => {
    const wrap = el('div');
    wrap.appendChild(mimicPanel(ctx,'Whole-Plant Process Diagram', MIMIC.plant,
      'Click any motor (M) for auto/manual control & specs'));
    // line state + sequence controls for all three areas
    const ctrl = el('div',{class:'grid cols-3'});
    [['Intake / Silo Filling','LINE_INTAKE_RUN'],
     ['Tempering','LINE_TEMPER_RUN'],
     ['Milling','LINE_MILL_RUN']].forEach(([title,tag])=>{
      ctrl.appendChild(el('div',{class:'panel'},
        el('div',{class:'panel-head'}, el('h2',{},title), el('div',{class:'spacer'}), lineStateChip(ctx,tag)),
        el('div',{style:'display:flex;gap:8px'},
          el('button',{class:'btn run sm',style:'flex:1',onclick:()=>{PLC.write(tag,true);UI.toast(title+' sequence STARTED','good');}},'▶ Start'),
          el('button',{class:'btn stop sm',style:'flex:1',onclick:()=>{PLC.write(tag,false);UI.toast(title+' sequence STOPPED','warn');}},'■ Stop'))));
    });
    wrap.appendChild(ctrl);
    return wrap;
  };

  RENDER.dashboard = (ctx) => {
    const wrap = el('div');
    // KPI tiles
    const tiles = el('div',{class:'grid cols-4',style:'margin-bottom:16px'});
    const mk=(label,fn,unit,kind,sub)=>{
      const v=el('div',{class:'value'}); const s=el('div',{class:'sub'},sub||'');
      const t=el('div',{class:'stat '+kind}, el('div',{class:'accent-bar'}),
        el('div',{class:'label'},label), v, s);
      ctx.refresh.push(()=>{ v.innerHTML=''; v.append(document.createTextNode(num(fn(),1)), el('small',{},unit)); });
      return t;
    };
    tiles.append(
      mk('Milling Rate', ()=>PLC.read('PV_MILL_TPH'),' t/h','good','Target '+num(PLC.read('SP_MILL_TPH'),0)+' t/h'),
      mk('Intake Rate', ()=>PLC.read('PV_FILL_TPH'),' t/h','grain','To '+PLC.VESSELS[PLC.read('SP_FILL_TARGET')][1]),
      mk('Extraction', ()=>PLC.read('PV_EXTRACTION'),' %','', 'Ash '+num(PLC.read('PV_ASH'),2)+'%'),
      mk('Flour Today', ()=>PLC.read('CNT_FLOUR_TODAY'),' t','good','Bran '+num(PLC.read('CNT_BRAN_TODAY'),1)+' t'),
    );
    wrap.appendChild(tiles);

    // three area panels
    const areas = el('div',{class:'grid cols-3'});
    areas.append(
      areaPanel(ctx,'Silo Filling','silos','LINE_INTAKE_RUN',['M_IC1','M_BE1','M_PC1','M_DST']),
      areaPanel(ctx,'Tempering','temper','LINE_TEMPER_RUN',['M_DAMP','M_WP1','M_TC1','M_BE2']),
      areaPanel(ctx,'Milling','mill','LINE_MILL_RUN',['M_B1','M_C1','M_SIFT','M_PNF']),
    );
    wrap.appendChild(areas);

    // trend
    const tpanel = el('div',{class:'panel',style:'margin-top:16px'},
      el('div',{class:'panel-head'},el('h2',{},'Live Trends — last 30 s'),el('div',{class:'spacer'}),
        el('div',{class:'legend'},
          legend('Mill t/h','#2ea043'),legend('Moisture %','#2f81f7'),legend('Extraction %','#c8a24b'))));
    const tnode = el('div'); tpanel.appendChild(tnode);
    ctx.refresh.push(()=>{ const tr=PLC.trends(); tnode.innerHTML='';
      tnode.appendChild(UI.trend([
        {data:tr.tph,color:'#2ea043'},
        {data:tr.moist,color:'#2f81f7'},
        {data:tr.extraction,color:'#c8a24b'},
      ],{max:100,h:130,w:1000})); });
    wrap.appendChild(tpanel);
    return wrap;
  };

  function legend(label,color){ return el('span',{class:'li'},el('span',{class:'sw',style:`background:${color}`}),label); }

  function areaPanel(ctx, title, area, lineTag, motors){
    const head = el('div',{class:'panel-head'},
      el('h2',{},title),el('div',{class:'spacer'}),

        el('td',{class:'mono'},(i+1)),
        el('td',{},i===0?'🏆 '+o.name:o.name),
        el('td',{class:'right mono'},num(o.tonnes,1)),
        el('td',{class:'right mono'},num(o.avgRate,1)),
        el('td',{class:'right mono'},num(o.avgExtract,1)+'%'),
        el('td',{style:'min-width:120px'},
          el('div',{class:'bar-track'},el('div',{class:'bar-fill good',style:`width:${o.eff}%`})))));
    });
    opPanel.appendChild(opTable);
    row.appendChild(opPanel);
    wrap.appendChild(row);

    // daily production trend (last 14 days)
    const daily=computeDailyTotals(logs);
    const dailyPanel=el('div',{class:'panel',style:'margin-bottom:16px'},
      el('div',{class:'panel-head'},el('h2',{},'Daily Flour Production — last 14 days')));
    dailyPanel.appendChild(UI.barChart(daily.map(d=>({label:d.date,value:d.tonnes,color:'var(--run)'})),{unit:' t',dec:1}));
    wrap.appendChild(dailyPanel);

    // recipe production log table
    const logPanel=el('div',{class:'panel flat'},
      el('div',{class:'panel-head',style:'padding:16px 16px 0'},el('h2',{},'Recipe Production Log'),el('div',{class:'spacer'}),
        el('button',{class:'btn sm',style:'margin:0 16px',onclick:exportLogs},'⤓ Export CSV')));
    const logTable=el('table',{class:'tbl'},
      el('tr',{},el('th',{},'Date / Time'),el('th',{},'Recipe'),el('th',{},'Operator'),el('th',{class:'right'},'Tonnes'),el('th',{class:'right'},'Rate t/h'),el('th',{class:'right'},'Extract %'),el('th',{},'Status')));
    logs.slice(0,40).forEach(l=>{
      logTable.appendChild(el('tr',{},
        el('td',{class:'mono'},new Date(l.ts).toLocaleString('en-AU',{hour12:false})),
        el('td',{},el('span',{style:'color:var(--grain);font-weight:600'},l.recipe)),
        el('td',{},l.operator),
        el('td',{class:'right mono'},num(l.tonnes,1)),
        el('td',{class:'right mono'},num(l.rate,1)),
        el('td',{class:'right mono'},num(l.extract,1)),
        el('td',{},el('span',{class:'pill '+(l.status==='Complete'?'run':'auto')},l.status))));
    });
    logPanel.appendChild(logTable);
    wrap.appendChild(logPanel);
    return wrap;
  };

  /* ================================================================
     REPORT DATA (seeded + accumulating, stored locally)
     ================================================================ */
  function ensureSeeded(){
    if (localStorage.getItem('scada.recipelog') == null)
      localStorage.setItem('scada.recipelog', JSON.stringify(seedRecipeLog()));
  }
  function getRecipeLog(){
    ensureSeeded();
    const log = JSON.parse(localStorage.getItem('scada.recipelog')||'[]');
    return log.sort((a,b)=>b.ts-a.ts);
  }
  function seedRecipeLog(){
    const out=[]; const now=Date.now();
    for (let d=29; d>=0; d--){
      const runs=2+Math.floor(Math.random()*3);
      for (let r=0;r<runs;r++){
        const rec=PLC.RECIPES[Math.floor(Math.random()*PLC.RECIPES.length)];
        const op=PLC.OPERATORS[Math.floor(Math.random()*PLC.OPERATORS.length)];
        const rate=rec.tph*(0.85+Math.random()*0.25);
        const extract=rec.extraction*(0.96+Math.random()*0.07);
        const hours=4+Math.random()*4;
        out.push({ ts: now - d*86400000 - r*5400000 - Math.random()*3600000,
          recipe:rec.name, recipeId:rec.id, operator:op,
          tonnes: rate*hours, rate, extract, status:'Complete' });
      }
    }
    return out;
  }
  function logRecipeStart(rec){
    ensureSeeded();
    const log=JSON.parse(localStorage.getItem('scada.recipelog')||'[]');
    log.push({ ts:Date.now(), recipe:rec.name, recipeId:rec.id, operator:currentOperator(),
      tonnes: PLC.read('CNT_FLOUR_TODAY')||0, rate:PLC.read('SP_MILL_TPH'),
      extract:PLC.read('PV_EXTRACTION')||rec.extraction, status:'In Progress' });
    localStorage.setItem('scada.recipelog', JSON.stringify(log));
  }
  function computeOperatorStats(logs){
    const m={};
    logs.forEach(l=>{ const o=m[l.operator]=m[l.operator]||{name:l.operator,tonnes:0,rate:0,extract:0,n:0};
      o.tonnes+=l.tonnes; o.rate+=l.rate; o.extract+=l.extract; o.n++; });
    const arr=Object.values(m).map(o=>({...o,avgRate:o.rate/o.n,avgExtract:o.extract/o.n}));
    // efficiency = blend of throughput vs rated and extraction performance
    const maxRate=Math.max(...arr.map(o=>o.avgRate),1);
    arr.forEach(o=>{ o.eff=Math.min(100, (o.avgRate/maxRate*55 + o.avgExtract/100*45)); });
    return arr.sort((a,b)=>b.eff-a.eff);
  }
  function computeDailyTotals(logs){
    const m={};
    logs.forEach(l=>{ const k=new Date(l.ts).toLocaleDateString('en-AU',{day:'2-digit',month:'short'});
      m[k]=(m[k]||0)+l.tonnes; });
    const keys=Object.keys(m).slice(0,14).reverse();
    return keys.map(k=>({date:k,tonnes:m[k]}));
  }
  function exportLogs(){
    const logs=getRecipeLog();
    const rows=[['Timestamp','Recipe','RecipeID','Operator','Tonnes','Rate_tph','Extraction_pct','Status']];
    logs.forEach(l=>rows.push([new Date(l.ts).toISOString(),l.recipe,l.recipeId,l.operator,
      l.tonnes.toFixed(2),l.rate.toFixed(2),l.extract.toFixed(2),l.status]));
    const csv=rows.map(r=>r.join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='production-log-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    UI.toast('Production log exported','good');
  }

  /* ================================================================
     BOOT
     ================================================================ */
  window.addEventListener('hashchange', () => { const id=location.hash.replace('#',''); if(id&&id!==current) go(id); });

  PLC.start();
  ensureSeeded();
  buildShell();
  render();
  // global periodic refresh for connection pill even if no tag changes
  setInterval(()=>{ refreshAlarms(); updateConn(); }, 1000);
})();

  </script>
</body>
